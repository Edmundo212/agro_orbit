{% extends "base.html" %}
{% block titulo %}Rotaciones{% endblock %}
{% block contenido %}
<h1>Escenarios de rotación</h1>
<p class="sub">Propuestas de 3 temporadas según suelo, agua e ingreso.</p>
<div class="row">
  <label>Cultivo anterior
    <select id="anterior"><option value="">(ninguno)</option>
    {% for c in cultivos %}<option>{{ c }}</option>{% endfor %}</select></label>
  <label>Humedad del suelo (0–1)<input id="humedad" type="number" step="0.05" min="0" max="1" value="0.5"></label>
  <button onclick="generar()">Generar escenarios</button>
</div>
<div class="grid" id="resultado"></div>
{% endblock %}
{% block scripts %}
<script>
const barra = (n, v) => `<div class="small">${n}: ${v}</div><div class="bar"><i style="width:${v}%"></i></div>`;
async function generar() {
  const r = await postJSON("/api/rotaciones", {anterior: anterior.value, humedad: parseFloat(humedad.value)});
  document.getElementById("resultado").innerHTML = r.map(e => `
    <div class="card"><b>${e.escenario}</b> <span class="small">· puntaje ${e.total}/100</span>
      <div class="seq">${e.secuencia.map(c => `<span>${c}</span>`).join("→")}</div>
      ${barra("Suelo", e.suelo)}${barra("Agua", e.agua)}${barra("Ingreso", e.ingreso)}
    </div>`).join("");
}
generar();
</script>
{% endblock %}
