{% extends "base.html" %}
{% block titulo %}NASA{% endblock %}
{% block contenido %}
<h1>Datos satelitales NASA</h1>
<p class="sub" id="fuente">Consulta clima y humedad de suelo por coordenadas.</p>
<div class="row">
  <label>Latitud<input id="lat" type="number" step="0.01" value="-9.93"></label>
  <label>Longitud<input id="lon" type="number" step="0.01" value="-76.24"></label>
  <label>Días<input id="dias" type="number" value="14" min="3" max="60"></label>
  <button onclick="cargar()">Consultar</button>
</div>
<div class="grid">
  <div class="card"><div class="k">Humedad de suelo</div><div class="v" id="k-h">–</div></div>
  <div class="card"><div class="k">Precipitación (mm/día)</div><div class="v" id="k-p">–</div></div>
  <div class="card"><div class="k">Temperatura (°C)</div><div class="v" id="k-t">–</div></div>
  <div class="card"><div class="k">NDVI</div><div class="v" id="k-n">–</div></div>
</div>
<div class="card"><canvas id="graf" height="110"></canvas></div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
let chart;
async function cargar() {
  const q = `lat=${lat.value}&lon=${lon.value}&dias=${dias.value}`;
  const r = await getJSON("/api/nasa?" + q);
  const d = r.datos, u = d[d.length - 1];
  document.getElementById("fuente").textContent = "Fuente: " + r.fuente;
  document.getElementById("k-h").textContent = u.humedad;
  document.getElementById("k-p").textContent = u.precipitacion;
  document.getElementById("k-t").textContent = u.temperatura;
  document.getElementById("k-n").textContent = u.ndvi;
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("graf"), {
    type: "line",
    data: {labels: d.map(x => x.fecha), datasets: [
      {label: "Humedad", data: d.map(x => x.humedad), borderColor: "#4ade80"},
      {label: "NDVI", data: d.map(x => x.ndvi), borderColor: "#facc15"},
      {label: "Lluvia (mm)", data: d.map(x => x.precipitacion), borderColor: "#38bdf8", yAxisID: "y2"}]},
    options: {scales: {y2: {position: "right", grid: {display: false}}}}
  });
}
cargar();
</script>
{% endblock %}
